  id: RDI-SS-14
  title: བློ་གྲོས་མཐའ་ཡས་པའི་མཛོད།
  author: ཐུན་མོང་བསྡུས་པའི་སྡོམ་ཚིག་བློ་གསལ་དགའ་བསྐྱེད།, མཛད་པ་པོ། ཞྭ་དམར་དྲུག་པ་ཆོས་ཀྱི་དབང་ཕྱུག།,
    བསྡུས་སྦྱོར་སྙིང་པོའི་དགོངས་དོན་གསལ་བར་བྱེད་པ་ཀུན་གསལ་མེ་ལོང།, མཛད་པ་པོ། གུང་ཐང་བློ་གྲོས་རྒྱ་མཚོ།
  authors: &id001
  - ཐུན་མོང་བསྡུས་པའི་སྡོམ་ཚིག་བློ་གསལ་དགའ་བསྐྱེད།
  - མཛད་པ་པོ། ཞྭ་དམར་དྲུག་པ་ཆོས་ཀྱི་དབང་ཕྱུག།
  - བསྡུས་སྦྱོར་སྙིང་པོའི་དགོངས་དོན་གསལ་བར་བྱེད་པ་ཀུན་གསལ་མེ་ལོང།
  - མཛད་པ་པོ། གུང་ཐང་བློ་གྲོས་རྒྱ་མཚོ།
