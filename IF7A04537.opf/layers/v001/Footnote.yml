    footnote_ref: ༡ མ་ཕྱིར་རྫས་མཐུན་གསལ་ཡང་ཡོངས་གྲགས་རིགས་བསྡུས་རྣམས་སུ་༼རྗེས་མཐུན་༽ཞེས་བྱུང་།
      མ་ཕྱིར་དེ་བཞིན་གསལ་ཡང་༡༼གང་ཡང་༽ ༢༼གང་ཡང་༽ཡིན་ནམ་སྙམ་། མ་ཕྱིར་དེ་བཞིན་གསལ་ཡང་༡༼ཞེས་བྱ་སྣང་རུང་མི་སྣང་བ།
      །༽ ༢༼མེའི་དགག་གཞིའི་དོན་དུ་༽ཡིན་ནམ་སྙམ།
