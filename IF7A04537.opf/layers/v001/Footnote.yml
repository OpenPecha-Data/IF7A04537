    footnote_ref: ༡ དངོས་བསྟན་དུ་བཅུ་གསུམ་ལས་མེད་ཀྱང་འདུ་ཤེས་མེད་པ་བསྟན་ནས་གྲངས་བཅུ་བཞིར་གྱུར་བས་དེ་བཞིན་ཡིན་སྙམ་བརྟག་།
